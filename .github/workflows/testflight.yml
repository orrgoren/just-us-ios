name: TestFlight

# Retired. Xcode Cloud archives and uploads. See docs/xcode-cloud.md.
# This file stays on workflow_dispatch so an old bookmark does not upload.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Retired
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Point at Xcode Cloud
        run: echo "TestFlight uploads moved to Xcode Cloud. See docs/xcode-cloud.md. This workflow does not archive."
