name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The remaining UI tests and Pro Max stay off the default run.
  # Nightly is not scheduled. Dispatch this workflow with ui_suite=full to run them.
  workflow_dispatch:
    inputs:
      ui_suite:
        description: smoke is launch, create-couple, and sign-out. full adds the rest of the UI tests and Pro Max.
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - full

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      screenshots: ${{ steps.filter.outputs.screenshots }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether UI tests run
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          UI_SUITE: ${{ github.event.inputs.ui_suite || 'smoke' }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          def emit(ui, screenshots, full):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"ui={ui}\n")
                  handle.write(f"screenshots={screenshots}\n")
                  handle.write(f"full={full}\n")
              print(f"ui={ui} screenshots={screenshots} full={full}")

          def skippable(path):
              return (
                  path.startswith("fastlane/")
                  or path == ".github/workflows/testflight.yml"
                  or path.startswith("docs/")
                  or path.endswith(".md")
              )

          def ui_file(path):
              return (
                  path.startswith("JustUs/Features/")
                  or path.startswith("JustUs/Design/")
                  or path.startswith("JustUs/Localization/")
                  or path.endswith(".xcstrings")
              )

          event = os.environ.get("EVENT_NAME", "")
          full = "true" if event == "workflow_dispatch" and os.environ.get("UI_SUITE") == "full" else "false"
          if full == "true":
              emit("true", "true", "true")
              raise SystemExit(0)
          base = os.environ.get("BASE_SHA", "") if event == "pull_request" else os.environ.get("BEFORE_SHA", "")
          if not base or set(base) <= {"0"}:
              emit("true", "true", full)
              raise SystemExit(0)
          diff = subprocess.run(
              ["git", "diff", "--name-only", base, "HEAD"],
              text=True,
              capture_output=True,
          )
          if diff.returncode != 0:
              print(diff.stderr)
              emit("true", "true", full)
              raise SystemExit(0)
          paths = [line for line in diff.stdout.splitlines() if line.strip()]
          for path in paths:
              print(path)
          # Empty diff and any file outside the docs/signing allowlist still run the smoke UI tests.
          ui = "false" if paths and all(skippable(path) for path in paths) else "true"
          screenshots = "true" if any(ui_file(path) for path in paths) else "false"
          emit(ui, screenshots, full)
          PY

  build:
    name: Build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Tools
        run: brew install xcodegen
      - name: Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 scripts/write-secrets.py
      - name: Project
        run: xcodegen generate
      - name: Build for testing
        run: |
          set -euo pipefail
          # Xcode 26 has no -continueBuildingAfterErrors flag. The IDE default keeps compiling every file.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          xcodebuild build-for-testing \
            -project JustUs.xcodeproj \
            -scheme JustUs \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

  test:
    name: SE and unit tests
    needs: [build, changes]
    if: ${{ always() && needs.build.result == 'success' && needs.changes.outputs.ui != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Tools
        run: brew install xcodegen swiftlint
      - name: Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 scripts/write-secrets.py
      - name: Project
        run: xcodegen generate
      - name: Lint and copy checks
        run: |
          swiftlint lint
          python3 scripts/check-literals.py
          python3 scripts/check-apple-docs.py
          python3 scripts/select-simulator.py --self-test
      - name: Test on iPhone SE
        env:
          SCREENSHOT_PREFIX: se
          TEST_RUNNER_SCREENSHOT_PREFIX: se
          FULL_UI: ${{ needs.changes.outputs.full }}
          SCREENSHOTS: ${{ needs.changes.outputs.screenshots }}
        run: |
          set -euo pipefail
          UDID=$(python3 scripts/select-simulator.py se | tail -n 1)
          printf '%s' "se" > /tmp/justus-screenshot-prefix.txt
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          # Unit tests plus launch, create-couple, and sign-out.
          # ui_suite=full runs every test in the scheme, including the rest of the UI suite.
          common=(
            -project JustUs.xcodeproj
            -scheme JustUs
            -destination "platform=iOS Simulator,id=${UDID}"
            -parallel-testing-enabled NO
            -resultBundlePath build/se.xcresult
            CODE_SIGNING_ALLOWED=NO
          )
          if [ "${FULL_UI}" = "true" ]; then
            xcodebuild test "${common[@]}"
          else
            # UI changes also capture the named gallery. Pro Max and the rest of the flow suite stay manual.
            only=(
              -only-testing:JustUsTests
              -only-testing:JustUsUITests/FlowUITests/testLaunchShowsLogin
              -only-testing:JustUsUITests/FlowUITests/testCreateCoupleAndInvite
              -only-testing:JustUsUITests/FlowUITests/testSignOutReturnsToLogin
            )
            if [ "${SCREENSHOTS}" = "true" ]; then
              only+=(-only-testing:JustUsUITests/ScreenshotUITests)
            fi
            xcodebuild test "${common[@]}" "${only[@]}"
          fi
      - name: Export screenshots
        if: always() && (needs.changes.outputs.screenshots == 'true' || needs.changes.outputs.full == 'true')
        run: |
          mkdir -p artifacts/screenshots artifacts/failures
          if [ -d build/se.xcresult ]; then
            xcrun xcresulttool export attachments --path build/se.xcresult --output-path artifacts/screenshots || true
            python3 scripts/name-attachments.py artifacts/screenshots artifacts/failures || true
          fi
          find artifacts/screenshots artifacts/failures -type f | head -200
          if [ ! -d build/se.xcresult ]; then
            echo "Missing build/se.xcresult"
            exit 1
          fi
          if ! find artifacts/screenshots artifacts/failures -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.heic' \) | grep -q .; then
            echo "No screenshot images were exported"
            exit 1
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se-results
          path: |
            build/se.xcresult
            artifacts/screenshots
            artifacts/failures
          if-no-files-found: warn

  promax:
    name: Pro Max UI tests
    needs: [build, changes]
    if: ${{ always() && needs.build.result == 'success' && needs.changes.outputs.full == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Tools
        run: brew install xcodegen
      - name: Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 scripts/write-secrets.py
      - name: Project
        run: xcodegen generate
      - name: UI tests on Pro Max
        env:
          SCREENSHOT_PREFIX: promax
          TEST_RUNNER_SCREENSHOT_PREFIX: promax
        run: |
          set -euo pipefail
          UDID=$(python3 scripts/select-simulator.py promax | tail -n 1)
          printf '%s' "promax" > /tmp/justus-screenshot-prefix.txt
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcodebuild test \
            -project JustUs.xcodeproj \
            -scheme JustUs \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -only-testing:JustUsUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath build/promax.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p artifacts/screenshots artifacts/failures
          if [ -d build/promax.xcresult ]; then
            xcrun xcresulttool export attachments --path build/promax.xcresult --output-path artifacts/screenshots || true
            python3 scripts/name-attachments.py artifacts/screenshots artifacts/failures || true
          fi
          find artifacts/screenshots artifacts/failures -type f | head -200
          if [ ! -d build/promax.xcresult ]; then
            echo "Missing build/promax.xcresult"
            exit 1
          fi
          if ! find artifacts/screenshots artifacts/failures -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.heic' \) | grep -q .; then
            echo "No screenshot images were exported"
            exit 1
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promax-results
          path: |
            build/promax.xcresult
            artifacts/screenshots
            artifacts/failures
          if-no-files-found: warn

  sql:
    name: Account SQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo service postgresql start
      - name: Lifecycle
        run: bash scripts/sql-lifecycle.sh
      - name: Function unit tests
        run: node --test supabase/proposed/functions/delete-couple-photos/drain.test.mjs supabase/proposed/functions/send-push/push.test.mjs
