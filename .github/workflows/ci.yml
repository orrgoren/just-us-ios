name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: SE and unit tests
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Tools
        run: brew install xcodegen swiftlint
      - name: Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 scripts/write-secrets.py
      - name: Project
        run: xcodegen generate
      - name: Lint and copy checks
        run: |
          swiftlint lint
          python3 scripts/check-literals.py
          python3 scripts/check-apple-docs.py
          python3 scripts/select-simulator.py --self-test
      - name: Test on iPhone SE
        env:
          SCREENSHOT_PREFIX: se
        run: |
          set -euo pipefail
          UDID=$(python3 scripts/select-simulator.py se)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcodebuild test \
            -project JustUs.xcodeproj \
            -scheme JustUs \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/se.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p artifacts/screenshots
          if [ -d build/se.xcresult ]; then
            xcrun xcresulttool export attachments --path build/se.xcresult --output-path artifacts/screenshots || true
          fi
          find artifacts/screenshots -type f | head -200
          if [ ! -d build/se.xcresult ]; then
            echo "Missing build/se.xcresult"
            exit 1
          fi
          if ! find artifacts/screenshots -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.heic' \) | grep -q .; then
            echo "No screenshot images were exported"
            exit 1
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se-results
          path: |
            build/se.xcresult
            artifacts/screenshots
          if-no-files-found: warn

  promax:
    name: Pro Max UI tests
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Tools
        run: brew install xcodegen
      - name: Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 scripts/write-secrets.py
      - name: Project
        run: xcodegen generate
      - name: UI tests on Pro Max
        env:
          SCREENSHOT_PREFIX: promax
        run: |
          set -euo pipefail
          UDID=$(python3 scripts/select-simulator.py promax)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcodebuild test \
            -project JustUs.xcodeproj \
            -scheme JustUs \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -only-testing:JustUsUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath build/promax.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p artifacts/screenshots
          if [ -d build/promax.xcresult ]; then
            xcrun xcresulttool export attachments --path build/promax.xcresult --output-path artifacts/screenshots || true
          fi
          find artifacts/screenshots -type f | head -200
          if [ ! -d build/promax.xcresult ]; then
            echo "Missing build/promax.xcresult"
            exit 1
          fi
          if ! find artifacts/screenshots -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.heic' \) | grep -q .; then
            echo "No screenshot images were exported"
            exit 1
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promax-results
          path: |
            build/promax.xcresult
            artifacts/screenshots
          if-no-files-found: warn
