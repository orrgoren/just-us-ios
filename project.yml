name: JustUs
options:
  bundleIdPrefix: com.orrgoren
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.6
targets:
  JustUs:
    type: application
    platform: iOS
    sources:
      - path: JustUs
    dependencies:
      - package: supabase-swift
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orrgoren.justus
        # JustUs/Info.plist registers the justus scheme used by justus://auth-callback.
        INFOPLIST_FILE: JustUs/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: JustUs/Entitlements/Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: JustUs/Entitlements/Release.entitlements
  JustUsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JustUsTests
      - path: Fixtures/apns
        buildPhase: resources
    dependencies:
      - target: JustUs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orrgoren.justus.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/JustUs.app/JustUs"
        BUNDLE_LOADER: "$(TEST_HOST)"
  JustUsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JustUsUITests
      - path: Fixtures/apns
        buildPhase: resources
    dependencies:
      - target: JustUs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orrgoren.justus.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: JustUs
schemes:
  JustUs:
    build:
      targets:
        JustUs: all
        JustUsTests: [test]
        JustUsUITests: [test]
    test:
      commandLineArguments:
        "-uitest": true
      targets:
        - name: JustUsTests
        - name: JustUsUITests
      gatherCoverageData: false
