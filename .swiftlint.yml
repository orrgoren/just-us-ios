disabled_rules:
  - trailing_comma
  - todo
  - nesting
opt_in_rules:
  - empty_count
  - explicit_init
line_length:
  warning: 160
  error: 220
file_length:
  warning: 600
  error: 900
function_body_length:
  warning: 80
  error: 140
function_parameter_count:
  warning: 8
  error: 10
type_body_length:
  warning: 450
  error: 700
cyclomatic_complexity:
  warning: 18
  error: 30
force_cast: error
force_try: error
force_unwrapping: error
identifier_name:
  min_length:
    warning: 1
    error: 1
  excluded:
    - id
    - to
    - x
    - y
    - r
    - g
    - b
large_tuple:
  warning: 4
  error: 5
excluded:
  - .xcodeproj
  - DerivedData
  - build
reporter: github-actions-logging
